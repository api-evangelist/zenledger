  root: Company
  depth: 4
  path_shape: /companies/{company_reference}/users/{user_id}/holdings/{source_id}
  note: >-
    The Compliance Suite is a strict containment tree rooted at Company, and every collection is available both
    scoped to a user and rolled up to the company. The Aggregator Suite is a separate, flat two-entity graph
    (Portfolio -> TaxCalculation) that shares only the token endpoint and the two reference-data collections.
