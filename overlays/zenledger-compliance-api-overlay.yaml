overlay: 1.0.0
info:
  title: API Evangelist enhancements for the ZenLedger Compliance Suite API
  version: '1.0.0'
  x-generated: '2026-09-05'
  x-method: generated
  x-source: openapi/zenledger-compliance-api-openapi.yml
  x-note: >-
    This Overlay records what API Evangelist added on top of ZenLedger's published contract. The base document is
    itself derived from the provider's Postman collection; this overlay never mutates that file. Applying it adds
    the runtime semantics ZenLedger documents in prose but does not encode in the contract — the OAuth 2.0 token
    flow, the request-signing requirement on the two import operations, the fixed pagination sizes, the shared
    response envelope, and the error-code namespace.
extends: openapi/zenledger-compliance-api-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-profile: https://apis.io/provider/zenledger/
    x-contract-provenance: derived-from-postman
    x-provider-publishes-openapi: false
- target: $.components.securitySchemes
  update:
    oauth2ClientCredentials:
      type: oauth2
      description: >-
        The token flow ZenLedger documents in prose in the Authentication folder of the published collection.
        Credentials are issued by ZenLedger; there is no self-serve key. Added by API Evangelist because the
        collection encodes only the resulting bearer token, not the flow that produces it.
      flows:
        clientCredentials:
          tokenUrl: https://api.zenledger.io/oauth/token
          scopes:
            public: The single scope value returned by the token endpoint.
- target: $.paths['/compliance/api/v3/companies/{company_reference}/users/{user_id}/imports'].post
  update:
