      signature_encoding: hex
      body_encryption: AES-256-CBC
      envelope_fields: [data, iv, signature]
      docs: https://docs.zenledger.io/compliance/v3/
      note: >-
        Documented in the Request Signature and Encryption folder, not on the operation. Recorded here so an agent
        reading the contract alone cannot miss that this operation is not a plain JSON POST.
    x-consequence: high
    x-emits-webhooks: [IMPORT_STATUS_UPDATE, ADDRESS_SCREENING_REPORT]
