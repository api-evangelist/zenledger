apis:
  - aid: zenledger:zenledger-compliance-suite-api
    name: ZenLedger Compliance Suite API
    description: >-
      Digital-asset trade-monitoring and crypto tax-compliance REST API (v3) for financial institutions and
      enterprise compliance teams. Registers companies and their users, imports exchange accounts and wallets over a
      signed and AES-256 encrypted request, returns normalized transactions and per-source holdings, screens
      blockchain addresses against sanctions lists, exposes Polymarket positions, and serves supported currency,
      source and chain reference data. Authenticated with an OAuth 2.0 client_credentials JWT that expires in 30
      minutes. Import completion, import-limit and wallet-screening events are delivered as webhooks.
    humanURL: https://docs.zenledger.io/compliance/v3/
    baseURL: https://api.zenledger.io
    tags:
      - Tax Compliance
      - Sanctions Screening
      - Digital Assets
      - RegTech
      - Blockchain Analytics
    tags_raw:
      - tax-compliance
      - sanctions-screening
      - digital-assets
      - regtech
      - blockchain-analytics
    properties:
      - type: OpenAPI
        url: openapi/zenledger-compliance-api-openapi.yml
      - type: Postman
        url: postman/zenledger-compliance-v3.postman_collection.json
      - type: Documentation
        url: https://docs.zenledger.io/compliance/v3/
      - type: APIReference
        url: https://docs.zenledger.io/compliance/v3/README.md
      - type: Overlay
        url: overlays/zenledger-compliance-api-overlay.yaml
      - type: Webhooks
        url: asyncapi/zenledger-compliance-webhooks.yml
  - aid: zenledger:zenledger-aggregator-suite-api
    name: ZenLedger Aggregator Suite API
    description: >-
      Partner/aggregator REST API (v1) that creates an aggregated portfolio from a set of exchange and wallet
      accounts, returns the resulting tax calculation for that portfolio by aggregation code, and serves the
      supported source and currency reference data. Authenticated with the same OAuth 2.0 client_credentials JWT as
      the Compliance Suite.
    humanURL: https://docs.zenledger.io/aggregators/rest-api/v1/
    baseURL: https://api.zenledger.io
    tags:
      - Portfolio Aggregation
      - Crypto Tax
      - Digital Assets
    tags_raw:
      - portfolio-aggregation
      - crypto-tax
      - digital-assets
    properties:
      - type: OpenAPI
        url: openapi/zenledger-aggregator-api-openapi.yml
      - type: Postman
        url: postman/zenledger-aggregators-v1.postman_collection.json
      - type: Documentation
        url: https://docs.zenledger.io/aggregators/rest-api/v1/
      - type: APIReference
        url: https://docs.zenledger.io/aggregators/rest-api/v1/README.md
