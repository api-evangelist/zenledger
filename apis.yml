aid: zenledger
name: ZenLedger
description: >-
  ZenLedger is a Seattle-founded crypto tax and digital-asset accounting company whose platform ingests transactions
  from 400+ exchanges, 100+ DeFi protocols and 10+ NFT marketplaces to calculate cost basis, capital gains and
  income, and generate US tax forms. Beyond the consumer product it operates two documented B2B REST APIs on
  api.zenledger.io: the Compliance Suite API (v3), a digital-asset trade-monitoring surface built with COMPLY for
  financial institutions and enterprise compliance teams that registers companies and users, imports wallets and
  exchange accounts, returns normalized transactions and holdings, and screens blockchain addresses against
  sanctions lists; and the Aggregator Suite API (v1), a partner surface that builds an aggregated portfolio from a
  set of accounts and returns the resulting tax calculation. Both authenticate with OAuth 2.0 client_credentials
  JWTs and are documented as versioned Postman collections at docs.zenledger.io.
url: https://raw.githubusercontent.com/api-evangelist/zenledger/refs/heads/main/apis.yml
image: https://zenledger.io/wp-content/uploads/2023/07/ZenLedger-OpenGraph.png
