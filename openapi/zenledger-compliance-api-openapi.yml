  /compliance/api/v3/screening:
    get:
      operationId: getWalletScreeningReport
      summary: GET Wallet Screening Report
      description: "### GET **/**screening\n\n**Returns** a wallet screening report by making a GET request to the\
        \ path `/screening` on the base URL.\n\nThis endpoint requires authentication via a bearer token, provided\
        \ in the Authorisation header of the request.\n\nThere are two versions of the screening service available:\
        \ **standard** and **extended**.  \nThe standard version provides a basic background check, while the extended\
        \ version returns a more comprehensive report with detailed risk insights and additional metadata.\n\n>\
        \ The version used is determined by your service tier and it can only be enabled on request.\n\n### Request\n\
        \n##### URi PARAMETERS\n\n> NONE\n\n##### QUERY PARAMETERS\n\n> **chain** `string` **Extended version only.**\
        \ Base coin of the Blockchain to check. The background check is run on all blockchains but a base chain\
        \ is required\n> \n> **address** `string` Wallet address to check\n\n##### RESPONSE `200`\n\n##### RESPONSE\
        \ DATA\n\n> **api_version** `string` Version of the targeted API\n> \n> **data** `string` Wrapper for response\
        \ data (See response example)"
      tags:
      - Wallet Screening
      parameters:
      - name: chain
        in: query
        required: false
        schema:
          type: string
        description: '**Extended version only.** Base coin of the Blockchain to check. The background check is run
          on all blockchains but a base chain is required'
        example: '{{chain}}'
      - name: address
        in: query
        required: false
        schema:
          type: string
        description: Wallet address to check
        example: '{{address}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_Standard_Wallet_Screening_Report_success:
                  value:
                    api_version: '3.0'
                    data:
                      screening_report:
                        status: filed
                        details:
                        - category: sanctioned entity
                          name: 'SANCTIONED ENTITY: OFAC SDN Secondeye Solution 2021-04-15 1da5821544e25c636c1417ba96ade4cf6d2f9b5a'
                        - category: sanctions
                          name: 'SANCTIONS: OFAC SDN Secondeye Solution 2021-04-15 1da5821544e25c636c1417ba96ade4cf6d2f9b5a'
                GET_Extended_Wallet_Screening_Report_success_Copy:
                  value:
                    api_version: '3.0'
                    data:
                      screening_report:
                        blockchain: ETH
                        address: '0x1da5821544e25c636c1417ba96ade4cf6d2f9b5a'
                        sanctioned_or_investigated: true
                        details:
                        - report_data:
                          - description: The address listed on the US Treasury Department's Office of Foreign Assets
                              Control sanction list.
                          owner_info:
                          - owner_info:
                            - name: Bittrex.com
                              url: https://www.Bittrex.com
                              legal_name: Bittrex Global GmbH
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_Wallet_Screening_Report_chain_not_supported:
                  value:
                    api_version: '3.0'
                    data: []
                    errors:
                      code: ZENCS-PARAMGET-AA6
                      message: chain not supported
                GET_Wallet_Screening_Report_chain_not_provided:
                  value:
                    api_version: '3.0'
                    data: []
                    errors:
                      code: ZENCS-PARAMGET-AA5
                      message: chain not provided
                GET_Wallet_Screening_Report_address_not_provided:
                  value:
                    api_version: '3.0'
                    data: []
                    errors:
                      code: ZENCS-PARAMGET-AA4
                      message: address not provided
      security:
      - bearerAuth: []
      x-postman-request: '{{base_url}}/compliance/api/v3/screening?chain={{chain}}&address={{address}}'
