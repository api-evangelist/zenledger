      bearerFormat: JWT
      description: JWT bearer token obtained from POST /oauth/token using the OAuth 2.0 client_credentials grant
        with the client_id and client_secret ZenLedger issues. The token expires after 30 minutes (expires_in 1800)
        and must be refreshed at the same endpoint.
