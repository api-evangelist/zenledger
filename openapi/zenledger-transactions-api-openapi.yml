openapi: 3.2.0
info:
  title: ZenLedger Compliance Suite Transactions API
  version: v3
  description: REST surface of the ZenLedger Compliance Suite — the digital-asset trade-monitoring and crypto tax-compliance API financial institutions and enterprises use to register companies and users, import exchange accounts and wallets, read normalized transactions and holdings, screen wallet addresses against sanctions lists, and look up the supported currencies, sources and chains.
  contact:
    name: ZenLedger
    url: https://zenledger.io/contact-us/
    email: support@zenledger.io
  termsOfService: https://zenledger.io/legal/
  x-generated-by: API Evangelist enrichment pipeline (derived from the provider-published Postman collection)
  x-source: postman/zenledger-compliance-v3.postman_collection.json
  x-source-url: https://docs.zenledger.io/compliance/v3/compliance_api.postman_collection.json
servers:
- url: https://api.zenledger.io
  description: ZenLedger production API host. The published collection resolves {{base_url}} to https://api.zenledger.io in every saved example response.
tags:
- name: Transactions
  description: Normalized crypto transactions for a user or across a company.
paths:
  /compliance/api/v3/companies/{company_reference}/users/{user_id}/transactions:
    get:
      operationId: getTransactionsForUser
      summary: GET transactions for user
      description: '### GET **/companies/{companyReference}/users/{userId}/transactions**


        **Returns** a list of the user''s transactions by making a GET request to the path `/companies/{company_reference}/users/{user_id}/transactions` on the base URL.


        This endpoint requires authentication via a bearer token, provided in the Authorisation header of the request.


        > *Results paginated with 100 elements per page


        ### Request


        ##### URi PARAMETERS


        > **companyReference** `string` The ID of a specific company

        >

        > **userId** `string` The ID of a specific user


        ##### QUERY PARAMETERS


        > **currency_code** `string` Filter transactions by currency code

        >

        > **date_from** `string` Specific cut-off date for the transactions list (beginning of the list) specific for the date when the transactions were imported into ZenLedger

        >

        > **date_to** `string` Specific cut-off date for the transactions list (end of the list) specific for the date when the transactions were imported into ZenLedger

        >

        > **transaction_date_from** `string` Specific cut-off date for the transactions list (beginning of the list) specific for the date when the transactions took place

        >

        > **transaction_date_to** `string` Specific cut-off date for the transactions list (end of the list) specific for the date when the transactions took place

        >

        > **source_id** `number` Specific source to show only transactions from a specific wallet/exchange

        >

        > **sorting_method** `string` Sorting method used to order the returned list of transactions. This can be set to **transaction_timestamps** or **import_timestamp**. If not set, the default sorting date will be the transaction date.

        >

        > **page** `number` Specific page requested for the paginated results


        ##### RESPONSE `200`


        ##### RESPONSE DATA


        > **api_version** `string` Version of the targeted API

        >

        > **data** `string` Wrapper for response data (See response example)'
      tags:
      - Transactions
      parameters:
      - name: company_reference
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific company
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific user
      - name: currency_code
        in: query
        required: false
        schema:
          type: string
        description: Filter transactions by currency code
      - name: date_from
        in: query
        required: false
        schema:
          type: string
        description: Specific cut-off date for the transactions list (beginning of the list) specific for the date when the transactions were imported into ZenLedger
      - name: date_to
        in: query
        required: false
        schema:
          type: string
        description: Specific cut-off date for the transactions list (end of the list) specific for the date when the transactions were imported into ZenLedger
      - name: transaction_date_from
        in: query
        required: false
        schema:
          type: string
        description: Specific cut-off date for the transactions list (beginning of the list) specific for the date when the transactions took place
      - name: transaction_date_to
        in: query
        required: false
        schema:
          type: string
        description: Specific cut-off date for the transactions list (end of the list) specific for the date when the transactions took place
      - name: source_id
        in: query
        required: false
        schema:
          type: number
        description: Specific source to show only transactions from a specific wallet/exchange
      - name: sorting_method
        in: query
        required: false
        schema:
          type: string
        description: Sorting method used to order the returned list of transactions. This can be set to **transaction_timestamps** or **import_timestamp**. If not set, the default sorting date will be the transaction date.
      - name: page
        in: query
        required: false
        schema:
          type: number
        description: Specific page requested for the paginated results
