  /compliance/api/v3/companies/{company_reference}/holdings/{source_id}/resync:
    get:
      operationId: getResyncSource
      summary: GET resync source
      description: '### GET **/companies/{companyReference}/holdings/{sourceId}/resync**


        **Returns** a 200 response when the source re-sync has been started successfully by making a GET request to the path `/companies/{company_reference}/holdings/{source_id}/resync` on the base URL.


        This endpoint requires authentication via a bearer token, provided in the Authorisation header of the request.


        ### Request


        ##### URi PARAMETERS


        > **companyReference** `string` The ID of a specific company

        > **sourceId** `string` The ID of a specific source


        ##### QUERY PARAMETERS


        > NONE


        ##### RESPONSE `200`


        ##### RESPONSE DATA


        > **api_version** `string` Version of the targeted API

        >

        > **data** `string` Wrapper for response data (See response example)'
      tags:
      - Holdings
      parameters:
      - name: company_reference
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific company
      - name: source_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific source
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_resync_source_success:
                  value:
                    api_version: '3.0'
                    data:
                    - message: Source 18831c28-9b97-4bd6-9a83-38ce426feb5e Re-Sync Started
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_resync_source_holding_not_found:
                  value:
                    api_version: '3.0'
                    data: []
                    errors:
                      code: ZENCS-HLDRSC-AA2
                      message: Holding not found
      security:
      - bearerAuth: []
      x-postman-request: '{{base_url}}/compliance/api/v3/companies/{{company_reference}}/holdings/{{source_id}}/resync'
  /compliance/api/v3/companies/{company_reference}/holdings/{source_id}/resume:
    get:
      operationId: getResumeSource
      summary: GET resume source
      description: '### GET **/companies/{companyReference}/holdings/{sourceId}/resume**


        **Returns** a 200 response when the source import has been resumed successfully by making a GET request to the path `/companies/{company_reference}/holdings/{source_id}/resume` on the base URL.


        This endpoint requires authentication via a bearer token, provided in the Authorisation header of the request.


        ### Request


        ##### URi PARAMETERS


        > **companyReference** `string` The ID of a specific company

        **sourceId** `string` The ID of a specific source


        ##### QUERY PARAMETERS


        > NONE


        ##### RESPONSE `200`


        ##### RESPONSE DATA


        > **api_version** `string` Version of the targeted API'
      tags:
      - Holdings
      parameters:
      - name: company_reference
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific company
      - name: source_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable source_id (from the Postman collection URL template).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_resume_source_success:
                  value:
                    api_version: '3.0'
                    data:
                    - message: Source 18831c28-9b97-4bd6-9a83-38ce426feb5e import resumed
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
              examples:
                GET_resume_source_holding_not_found:
                  value:
                    api_version: '3.0'
                    data: []
                    errors:
                      code: ZENCS-HLDRSC-AA2
                      message: Holding not found
      security:
      - bearerAuth: []
      x-postman-request: '{{base_url}}/compliance/api/v3/companies/{{company_reference}}/holdings/{{source_id}}/resume'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token obtained from POST /oauth/token using the OAuth 2.0 client_credentials grant with the client_id and client_secret ZenLedger issues. The token expires after 30 minutes (expires_in 1800) and must be refreshed at the same endpoint.
