    get:
      operationId: getHoldingsForUserBySource
      summary: GET holdings for user by source
      description: '### GET **/companies/{companyReference}/users/{userId}/holdings/{sourceId}**


        **Returns** the holdings of a specific source of a user by making a GET request to the path `/companies/{company_reference}/users/{user_id}/holdings/{source_id}` on the base URL.


        This endpoint requires authentication via a bearer token, provided in the Authorisation header of the request.


        ### Request


        ##### URi PARAMETERS


        > **companyReference** `string` The ID of a specific company

        >

        > **userId** `string` The ID of a specific user

        >

        > **sourceId** `string` The ID of a specific source


        ##### QUERY PARAMETERS


        > NONE


        ##### RESPONSE `200`


        ##### RESPONSE DATA


        > **api_version** `string` Version of the targeted API

        >

        > **data** `string` Wrapper for response data (See response example)'
      tags:
      - Holdings
      parameters:
      - name: company_reference
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific company
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific user
      - name: source_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of a specific source
      responses:
