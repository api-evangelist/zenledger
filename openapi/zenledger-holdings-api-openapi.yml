    delete:
      operationId: deleteUserSource
      summary: DELETE user source
      description: '### DELETE **/companies/{companyReference}/users/{userId}/holdings/{sourceId}**


        **Deletes** a user''s source along with its transactions by making a DELETE request to the `/compliance/api/v3/companies/{company_reference}/users/{user_id}/holdings/{source_id}` endpoint.


        This endpoint requires authentication via a bearer token, provided in the Authorisation header of the request.


        ### Request


        ##### URi PARAMETERS


        > **companyReference** `string` The ID of a specific company


        > **userId** `string` The ID of a specific user


        > **sourceId** `string` The ID of a specific source


        ##### QUERY PARAMETERS


        > NONE


        ##### RESPONSE `200`


        ##### RESPONSE DATA


        > **api_version** `string` Version of the targeted API

