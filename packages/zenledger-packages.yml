finding: >-
  ZenLedger publishes NO client SDK for either of its APIs, in any language. Neither the Compliance Suite v3
  reference nor the Aggregator Suite v1 reference links a client library; both teach integration with raw fetch()
  examples in JavaScript and TypeScript. Registry searches on 2026-09-05 returned nothing first-party: npm returned
  a single unrelated third-party result, PyPI 404s on `zenledger`, RubyGems and crates.io return empty result sets.
  The GitHub organization github.com/zenledger-io holds 19 repositories, but they are internal Go/Ruby utilities
  and forks of third-party exchange API clients (Kraken, Binance, Coinbase, Bitfinex, Gemini, HitBTC, Cryptopia,
  QuadrigaCX) that ZenLedger uses to ingest data FROM exchanges — they are not clients FOR the ZenLedger API. The
  three Go modules below are resolvable through the Go module proxy, which is what makes them packages at all;
  ZenLedger does not present them as SDKs and none wraps the published API. No SDKs pointer is emitted on this
  record, because there is no SDK.
