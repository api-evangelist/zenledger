decay_signal:
  assessment: >-
    There is no first-party SDK to decay. The only dated first-party publishing signal available is the internal Go
    modules, whose newest release is 2024-04-12 and whose two tagged modules last shipped in 2022 and 2020 — none
    of which tracks the API. The integration surface a customer actually consumes is the Postman collection, which
    is current (it documents Polymarket positions and the import-limit webhook), so the absence of an SDK is a
    deliberate posture rather than an abandoned one.
