note: 'ZenLedger does not use RFC 9457 application/problem+json. Errors are returned inside the standard JSON envelope
  as an `errors` object carrying a namespaced string code and a human message, with the HTTP status carrying the
  class. Codes are namespaced per API: ZENCS-* for the Compliance Suite, ZENAGG-* for the Aggregator Suite. The
  middle segment names the resource and verb (AUTHGET, CMPPST, USRDEL, HLDRSC, PFLPST, PARAMGET, RSRCGET).'
