    status: maintained
    evidence: >-
      "We understand the need for security and maintain SOC 2 Type II compliance to hold the highest standards for
      your data" — https://zenledger.io/compliance/. The security page states the Information Security Program
      "follows the criteria set forth by the SOC 2 Framework" and that the organization "undergoes independent
      third-party assessments to test our security and compliance controls."
    report_available: not-published
    note: No trust center, no public report request flow, and no named auditor. The claim is prose on a marketing page; there is no downloadable or gated report portal.
  practices:
  - name: Independent third-party penetration testing
    frequency: at least annually
    evidence: https://zenledger.io/security/
  - name: Annual risk assessments
    frequency: at least annually
    evidence: https://zenledger.io/security/
  - name: Quarterly access reviews
    frequency: quarterly
    evidence: https://zenledger.io/security/
  - name: Encryption at rest and in transit (TLS/SSL only)
    evidence: https://zenledger.io/security/
  - name: Vendor risk management and published subprocessor list
    evidence: https://zenledger.io/subprocessors/
  - name: Security awareness training and background checks for all staff
    evidence: https://zenledger.io/security/
